# --- ActiveMQ Artemis Config ---
spring.artemis.mode=native
#spring.artemis.broker-url=tcp://localhost:61616
spring.artemis.broker-url=tcp://192.168.10.6:61616
spring.artemis.user=admin
spring.artemis.password=admin

# --- IBM WebSphere MQ Config ---
#Port 1414
ibm.mq.mq1.queue-manager=UFISMQ
ibm.mq.mq1.channel=UFIS_CHANNEL
ibm.mq.mq1.conn-name=localhost(1414)
ibm.mq.mq1.user=app
ibm.mq.mq1.password=password
# Port 1415
ibm.mq.mq2.queue-manager=UFISMQ2
ibm.mq.mq2.channel=UFISMQ2_CHANNEL
ibm.mq.mq2.conn-name=localhost(1415)
ibm.mq.mq2.user=app
ibm.mq.mq2.password=password
#ibm.mq.conn-name=192.168.1.100(1414)
# ตั้งเป็น false บนเครื่องที่ยังไม่มี WebSphere MQ (ปิด listener ทั้งหมด + ไม่ส่ง outbound) เพื่อไม่ให้ error ตอน startup
websphere.mq.enabled=true

spring.main.banner-mode=off
